name: Deploy web to Pages

# Why the web build is deployed at all, given the product is Android-only:
# an invite link lives in a group chat and gets opened by people who have
# never heard of the app. Until it is on Play, "install this first" is the
# same as "no". The web build is the fallback that lets an invitee answer the
# one question the organiser needs answered — when are you free — in the
# browser they already have open.
#
# Reading the device calendar does not work on the web (there is no API for
# it), so those people use the manual editor. That is exactly why it exists.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'docs/**'
      - 'pubspec.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN does not have them.
permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one half-way — a partial deploy
# would leave main.dart.js and index.html out of step.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      # The anon key is public by design — it ships in every build and RLS is
      # what protects the data. It lives in repository secrets anyway so that
      # rotating it does not mean editing a workflow file.
      # A prod build refuses to start without a backend (Env.assertConfigured),
      # so a missing secret would deploy a white screen with no explanation.
      # Fail here instead, where the message is readable.
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] \
             || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_ANON_KEY in"\
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          # The owner has to be lower-cased: github.io hostnames are, and a
          # link with a capital in the host is the kind of thing that lives
          # in a group chat forever looking slightly wrong. The repo part
          # keeps its case — that half of the path IS case-sensitive.
          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"

          flutter build web --release \
            --base-href "/$REPO/" \
            --dart-define=FLAVOUR=prod \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=INVITE_BASE="https://$OWNER.github.io/$REPO/i" \
            --dart-define=GOOGLE_CALENDAR_CLIENT_ID="${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}"

      # docs/404.html is the invite landing page and is NOT generated by the
      # Flutter build. GitHub Pages serves it for any unknown path, which is
      # what makes /i/<token> resolve at all. Copied in, never the other way
      # round: copying all of docs/ would clobber Flutter's index.html.
      #
      # The backend it talks to is substituted here rather than written into
      # the file, for the same reason the Flutter build takes it as a define:
      # a hard-coded project ref survives the switch to production and nothing
      # reports it. The grep is the guard — if somebody inlines the values
      # again, this step fails instead of silently copying them.
      - name: Add the invite landing page
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for p in __SUPABASE_URL__ __SUPABASE_ANON_KEY__; do
            grep -q "$p" docs/404.html || {
              echo "::error::docs/404.html is missing the $p placeholder."
              exit 1
            }
          done
          sed -e "s|__SUPABASE_URL__|$SUPABASE_URL|g" \
              -e "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" \
              docs/404.html > build/web/404.html
          touch build/web/.nojekyll

          # oauth.html se sem nekopíruje: leží ve web/ a flutter build web ho
          # tam odnese sám. Je to i jediný způsob, jak ho obsloužit lokálně na
          # `flutter run -d chrome` — dev server servíruje web/, ne docs/, a
          # návratovou adresu, která existuje jen po nasazení, nejde vyzkoušet.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
