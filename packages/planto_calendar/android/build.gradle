// Modern declarative form. The previous version of this file pinned its own
// AGP 8.1.0 and Kotlin 1.9.22 in a `buildscript` block, while the app uses
// AGP 9.0.1 and Kotlin 2.3.20 (see android/settings.gradle.kts). Two different
// AGP versions on one build classpath cannot configure, which is why nothing
// would install.
//
// Versions now come from the app's pluginManagement — a Flutter plugin is
// included into the app's Gradle build, so it inherits them and cannot drift.
plugins {
    id "com.android.library"
}

// Built-in Kotlin, gated on the flag that actually decides it.
//
// `flutter run` warns that this plugin applies the Kotlin Gradle Plugin and
// that a future Flutter will refuse to build because of it. The fix is real
// but it is NOT unlocked by AGP 9 — the first attempt here keyed off the AGP
// major version and broke the build in two seconds, because AGP 9 does not
// supply Kotlin unless built-in Kotlin is switched on. Without KGP and without
// that switch there is no `kotlin {}` extension at all, and the block below
// fails with "Could not find method kotlin()".
//
// What decides it is `android.builtInKotlin` in the app's gradle.properties,
// which requires Flutter 3.47 or later. So: read that flag, and apply KGP
// whenever it is off. Absent property means false means today's behaviour,
// unchanged. When the app is on 3.47 and sets the flag, this file needs no
// edit — it stops applying KGP on its own and the warning goes away.
//
// The `kotlin {}` block stays either way: with built-in Kotlin the extension
// comes from AGP instead of from KGP, and the JVM target still has to be said
// out loud.
def builtInKotlin = Boolean.parseBoolean(
    (project.findProperty('android.builtInKotlin') ?: 'false').toString())
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

group = "app.planto.calendar"
version = "0.1.0"

android {
    namespace = "app.planto.calendar"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// No dependencies on purpose.
//
// The plugin originally used androidx ContextCompat/ActivityCompat without
// declaring androidx.core — a library module does not get it transitively, so
// that alone was a compile failure. Since minSdk is 24 and every one of those
// calls exists on Context/Activity from API 23, the androidx wrappers buy
// nothing here. Zero dependencies is one less version to reconcile in the part
// of the codebase that is hardest to test.
